name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - run: ruff check core

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]   # numpy 2.5 requires Python >= 3.12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Unit tests
        working-directory: core
        run: python -m unittest discover -s . -q
      - name: Imaging tests
        working-directory: core
        run: python -m unittest discover -s imaging_tests -q

  reproduce:
    # Regenerate every derived result the manuscript quotes from the released inputs and compare.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Keep the released copies
        run: cp -r results /tmp/released
      - name: Freeze records
        working-directory: core
        run: python verify_freezes.py --root ..
      - name: Regenerate
        working-directory: core
        run: |
          python expB_score_v3.py --expb ../results/expB --expa ../results/expA
          python expB_paper_results.py --expb ../results/expB --expa ../results/expA
          python expB_rank_ablation.py --expb ../results/expB --expa ../results/expA
          python paper/manuscript_numbers.py --census ../results/seg_census --expa ../results/expA --expb ../results/expB --out ../results
          python paper/figures.py --census ../results/seg_census --expa ../results/expA --expb ../results/expB --out ../figures
      - name: Compare with the released results
        working-directory: core
        run: python check_reproduced.py --released /tmp/released --regenerated ../results expB/results_v3.json expB/paper_results.json expB/rank_ablation.json numbers.json
      - name: Qualitative claims
        working-directory: core
        run: python expB_claims_check.py --expb ../results/expB --expa ../results/expA
