[project]
name = "target-mixup-core"
version = "0.1.2"
description = "Code and derived results for a staged study of target mix-ups in AI-assisted lung CT analysis"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "Shuji Yamamoto", email = "yamamoto@lisit.jp"}]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# Correctness only (pyflakes and syntax); frozen modules are hashed byte for byte and are not reformatted.
select = ["F", "E9"]
